; Pool overrides, layered on top of the image's default www.conf.
; PHP-FPM merges these files in filename order, so values here win.

[www]
; nginx and PHP-FPM share this container, so FPM must not listen on the
; network. Only nginx should be reachable from outside.
listen = 127.0.0.1:9000

user = www-data
group = www-data

; 8 children x ~80 MB resident is a safe ceiling when MySQL and nginx are
; competing for the same 2 GB of RAM. A low-traffic event site rarely needs
; more, and this is far better than the OOM killer stepping in.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers periodically so any slow leak in a long-lived request never
; accumulates across weeks of uptime.
pm.max_requests = 500

; Send PHP errors to the container log instead of a file nothing reads.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; Never let a request pin a worker indefinitely.
request_terminate_timeout = 120s
