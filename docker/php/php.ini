; Runtime PHP tuning.
; Sized for a 2 vCPU / 2 GB instance that also runs MySQL 8.4 in a sibling
; container, so the numbers are deliberately conservative.

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Event listings will accept image uploads, so keep the ceiling above the
; 20M that nginx allows, otherwise PHP silently drops oversized POST bodies.
upload_max_filesize = 20M
post_max_size = 22M
max_file_uploads = 20

expose_php = Off

; --- Opcache -----------------------------------------------------------------
; validate_timestamps is left ON with a 2s recheck window. Turning it off is
; marginally faster but serves stale bytecode after a deploy whenever the
; container is not restarted, which is a genuinely painful bug to chase. At
; this scale the performance difference is irrelevant.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

date.timezone = UTC

; Production: assertions compiled out, display errors never reach output.
zend.assertions = -1
display_errors = Off
log_errors = On
