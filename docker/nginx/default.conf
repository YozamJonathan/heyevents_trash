server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Must stay >= PHP's post_max_size (22M) in docker/php/php.ini, otherwise
    # nginx rejects the upload that PHP was willing to accept.
    client_max_body_size 20M;
    client_body_timeout 120s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable once TLS terminates in front of this vhost:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Static assets -------------------------------------------------------
    # Vite fingerprints every file in public/build, so their contents change
    # whenever their name does. Caching them for a year is safe and is the
    # single biggest win for perceived page speed.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # public/storage is a symlink into the storage volume, so user uploads get
    # the same long-lived caching. They are not fingerprinted, hence the
    # one-week ceiling instead of one year.
    location ^~ /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Application ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # try_files guards against a request reaching PHP for a .php file that
        # does not exist. Without it, a crafted path can be handed to the
        # interpreter as a script name.
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Block dotfiles: .env, .git, editor droppings.
    # .well-known is excluded so ACME challenges for a future certbot setup work.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;
}
